services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: solaris
      MYSQL_USER: solaris
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: ./solaris
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Define APP_URL}
      APP_KEY: ${APP_KEY:?Define APP_KEY}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: solaris
      DB_USERNAME: solaris
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD}
      DEMO_DATA: ${DEMO_DATA:-true}
      SEED_ON_BOOT: "true"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped
volumes:
  mysql_data:
  app_storage:
